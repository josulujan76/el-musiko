<!DOCTYPE html>
<html lang="es" data-estilo="Rock">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Musiko</title>
  <link rel="stylesheet" href="style.css?v=musiko-playtest8">
</head>
<body>
  <div class="app">
    <div class="escenario">
    <div id="pantalla1" class="pantalla visible">
      <p class="marca">EL MUSIKO</p>
      <button id="btn-audio" class="btn btn-secundario" type="button" onclick="alternarAudio()" style="margin-bottom:10px">AUDIO: ON</button>
      <h1>Nueva carrera</h1>
      <div class="tarjeta">
        <div id="bloque-continuar" class="campo" style="display:none">
          <button class="btn btn-principal" type="button" onclick="continuarPartida()">CONTINUAR PARTIDA</button>
          <p class="muted" id="resumen-partida-guardada" style="margin-top:8px"></p>
        </div>
        <div class="campo">
          <label for="nacionalidad">Nacionalidad</label>
          <select id="nacionalidad"><option value="Argentina">Argentina</option></select>
        </div>
        <div class="campo">
          <label>Estilo musical</label>
          <input type="hidden" id="estilo" value="Rock">
          <div class="ritmo">
            <button type="button" class="opcion-ritmo opcion-estilo activo" data-estilo="Rock" onclick="elegirEstilo('Rock')">Rock</button>
            <button type="button" class="opcion-ritmo opcion-estilo" data-estilo="Pop" onclick="elegirEstilo('Pop')">Pop</button>
            <button type="button" class="opcion-ritmo opcion-estilo" data-estilo="Cumbia" onclick="elegirEstilo('Cumbia')">Cumbia</button>
            <button type="button" class="opcion-ritmo opcion-estilo" data-estilo="Reggae" onclick="elegirEstilo('Reggae')">Reggae</button>
          </div>
        </div>
        <div class="campo">
          <label>Ritmo</label>
          <input type="hidden" id="modo" value="Normal">
          <div class="ritmo">
            <button type="button" class="opcion-ritmo activo" data-modo="Normal" onclick="elegirModo('Normal')">Normal<small>Avanza de a 2 años</small></button>
            <button type="button" class="opcion-ritmo" data-modo="Intenso" onclick="elegirModo('Intenso')">Intenso<small>Avanza de a 1 año</small></button>
          </div>
        </div>
        <div class="acciones">
          <button class="btn btn-principal" onclick="irACrearMusico()">SIGUIENTE</button>
        </div>
      </div>
    </div>
    <div id="pantalla2" class="pantalla">
      <p class="marca">EL MUSIKO</p>
      <h1>Creá tu músico</h1>
      <div class="tarjeta">
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre">
        </div>
        <div class="campo campo-avatar">
          <label>Look</label>
          <div class="avatar-preview-wrap">
            <div id="avatar-preview" class="avatar-musiko avatar-musiko-preview" aria-hidden="true">🧑‍🎤</div>
          </div>
          <input type="hidden" id="avatar-genero" value="elle">
          <input type="hidden" id="avatar-pelo" value="corto">
          <input type="hidden" id="avatar-look" value="rock">
          <input type="hidden" id="avatar-accesorio" value="nada">

          <p class="avatar-chip-label">Género</p>
          <div class="ritmo ritmo-avatar">
            <button type="button" class="opcion-ritmo opcion-avatar" data-avatar-campo="genero" data-avatar-valor="ella" onclick="elegirAvatar('genero','ella')">ella</button>
            <button type="button" class="opcion-ritmo opcion-avatar activo" data-avatar-campo="genero" data-avatar-valor="elle" onclick="elegirAvatar('genero','elle')">elle</button>
            <button type="button" class="opcion-ritmo opcion-avatar" data-avatar-campo="genero" data-avatar-valor="él" onclick="elegirAvatar('genero','él')">él</button>
          </div>

          <p class="avatar-chip-label">Pelo</p>
          <div class="ritmo ritmo-avatar">
            <button type="button" class="opcion-ritmo opcion-avatar activo" data-avatar-campo="pelo" data-avatar-valor="corto" onclick="elegirAvatar('pelo','corto')">corto</button>
            <button type="button" class="opcion-ritmo opcion-avatar" data-avatar-campo="pelo" data-avatar-valor="largo" onclick="elegirAvatar('pelo','largo')">largo</button>
            <button type="button" class="opcion-ritmo opcion-avatar" data-avatar-campo="pelo" data-avatar-valor="mohawk" onclick="elegirAvatar('pelo','mohawk')">mohawk</button>
            <button type="button" class="opcion-ritmo opcion-avatar" data-avatar-campo="pelo" data-avatar-valor="rapado" onclick="elegirAvatar('pelo','rapado')">rapado</button>
          </div>

          <p class="avatar-chip-label">Look</p>
          <div class="ritmo ritmo-avatar">
            <button type="button" class="opcion-ritmo opcion-avatar activo" data-avatar-campo="look" data-avatar-valor="rock" onclick="elegirAvatar('look','rock')">rock</button>
            <button type="button" class="opcion-ritmo opcion-avatar" data-avatar-campo="look" data-avatar-valor="cumbia" onclick="elegirAvatar('look','cumbia')">cumbia</button>
            <button type="button" class="opcion-ritmo opcion-avatar" data-avatar-campo="look" data-avatar-valor="indie" onclick="elegirAvatar('look','indie')">indie</button>
          </div>

          <p class="avatar-chip-label">Accesorio</p>
          <div class="ritmo ritmo-avatar ritmo-avatar-acc">
            <button type="button" class="opcion-ritmo opcion-avatar activo" data-avatar-campo="accesorio" data-avatar-valor="nada" onclick="elegirAvatar('accesorio','nada')">nada</button>
            <button type="button" class="opcion-ritmo opcion-avatar" data-avatar-campo="accesorio" data-avatar-valor="pañuelo" onclick="elegirAvatar('accesorio','pañuelo')">pañuelo</button>
            <button type="button" class="opcion-ritmo opcion-avatar" data-avatar-campo="accesorio" data-avatar-valor="lentes" onclick="elegirAvatar('accesorio','lentes')">lentes</button>
            <button type="button" class="opcion-ritmo opcion-avatar" data-avatar-campo="accesorio" data-avatar-valor="piercing" onclick="elegirAvatar('accesorio','piercing')">piercing</button>
          </div>
        </div>
        <div class="campo">
          <label>Instrumento</label>
          <input type="hidden" id="instrumento" value="">
          <div id="opciones-instrumento" class="ritmo"></div>
        </div>
        <div class="acciones">
          <button class="btn btn-secundario" onclick="volverInicio()">VOLVER</button>
          <button class="btn btn-principal" onclick="comenzarCarrera()">COMENZAR CARRERA</button>
        </div>
      </div>
    </div>
    </div>
  </div>
  <script src="game.js?v=musiko-playtest8"></script>
</body>
</html>
